  /api/holidays:
    get:
      summary: Lihat Hari Libur
      description: Mengambil daftar hari libur nasional berdasarkan tahun dan kode negara.
      tags:
        - Holidays
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: year
          schema:
            type: integer
          required: false
          description: Year (default current year)
        - in: query
          name: month
          schema:
            type: integer
          required: false
          description: Month 1-12 (default current month)
        - in: query
          name: country
          schema:
            type: string
          required: false
          description: Country Code (default ID)
      responses:
        '200':
          description: Berhasil mendapatkan hari libur
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Holiday'
        '401':
          description: Unauthorized - Token diperlukan atau token salah
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Token diperlukan'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Internal server error'

