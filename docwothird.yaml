  /api/graphql:
    post:
      summary: Endpoint GraphQL
      description: Endpoint fleksibel untuk melakukan query data spesifik menggunakan bahasa query GraphQL.
      tags:
        - GraphQL
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  example: '{ myEvents { id title date place notes userId} }'
                variables:
                  type: object
      responses:
        '200':
          description: GraphQL Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      myEvents:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: '692f777c80a1b78ac42a15a0'
                            title:
                              type: string
                            date:
                              type: string
                              format: date
                              example: '2025-02-02'
                            place:
                              type: string
                              example: 'Vatulemo'
                            notes:
                              type: string
                              example: 'konser amal'
                            userId:
                              type: string
                              example: '69295be716215fe093c99aff'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
