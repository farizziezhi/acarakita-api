<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - AcaraKita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              xblack: '#000000',
              xdark: '#16181c',
              xgray: '#2F3336',
              xblue: '#1D9BF0',
              xtext: '#E7E9EA',
              xtextgray: '#71767B',
            },
            fontFamily: {
              sans: [
                'system-ui',
                '-apple-system',
                'BlinkMacSystemFont',
                'Segoe UI',
                'Roboto',
                'Ubuntu',
                'Helvetica Neue',
                'sans-serif',
              ],
            },
          },
        },
      }
    </script>
    <script>
      if (localStorage.getItem('token')) {
        window.location.href = 'dashboard.html'
      }
    </script>
  </head>
  <body class="min-h-screen bg-[#242d34] flex items-center justify-center p-4">
    <!-- Modal Container -->
    <div
      class="bg-black w-full max-w-[600px] min-h-[500px] rounded-2xl md:rounded-3xl shadow-xl flex flex-col p-8 md:p-14 relative"
    >
      <!-- Close Button (back to home) -->
      <button
        onclick="window.location.href='index.html'"
        class="absolute top-4 left-4 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-800 transition text-xtext"
      >
        ✕
      </button>

      <!-- Header / Logo Area -->
      <div class="flex justify-center mb-8">
        <!-- Replaced "A" Box with the X logo or AcaraKita Text, keeping it minimal -->
        <span class="text-xtext font-bold text-3xl">AcaraKita</span>
      </div>

      <div class="flex flex-col items-center w-full max-w-[320px] mx-auto flex-1 justify-center">
        <h1 class="text-2xl font-bold text-xtext mb-8 w-full text-left">Masuk ke AcaraKita</h1>

        <form id="loginForm" class="w-full space-y-6">
          <div
            id="errorMessage"
            class="hidden text-red-500 text-sm font-bold text-center bg-red-900/20 py-2 rounded"
          ></div>

          <!-- Email (Refined Input Style) -->
          <div class="relative group">
            <input
              type="email"
              id="email"
              class="w-full bg-black border border-gray-600 rounded text-xtext px-3 pt-5 pb-2 focus:border-xblue focus:ring-1 focus:ring-xblue focus:outline-none placeholder-transparent peer transition-colors"
              placeholder="Email"
              required
            />
            <label
              for="email"
              class="absolute left-3 top-2 text-xtextgray text-sm transition-all peer-placeholder-shown:text-base peer-placeholder-shown:top-3.5 peer-focus:top-1 peer-focus:text-xs peer-focus:text-xblue"
            >
              Email
            </label>
          </div>

          <!-- Password -->
          <div class="relative group">
            <input
              type="password"
              id="password"
              class="w-full bg-black border border-gray-600 rounded text-xtext px-3 pt-5 pb-2 focus:border-xblue focus:ring-1 focus:ring-xblue focus:outline-none placeholder-transparent peer transition-colors"
              placeholder="Password"
              required
            />
            <label
              for="password"
              class="absolute left-3 top-2 text-xtextgray text-sm transition-all peer-placeholder-shown:text-base peer-placeholder-shown:top-3.5 peer-focus:top-1 peer-focus:text-xs peer-focus:text-xblue"
            >
              Password
            </label>
          </div>

          <button
            type="submit"
            id="submitBtn"
            class="w-full bg-xtext text-black font-bold py-3 rounded-full hover:bg-gray-200 transition-colors disabled:opacity-50 mt-4"
          >
            Masuk
          </button>
        </form>

        <div class="mt-8 flex space-x-2 text-sm text-xtextgray">
          <span>Belum punya akun?</span>
          <a href="register.html" class="text-xblue hover:underline">Daftar</a>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script>
      const form = document.getElementById('loginForm')
      const submitBtn = document.getElementById('submitBtn')
      const errorMessage = document.getElementById('errorMessage')

      form.addEventListener('submit', async (e) => {
        e.preventDefault()

        const email = document.getElementById('email').value
        const password = document.getElementById('password').value

        submitBtn.disabled = true
        submitBtn.textContent = 'Sedang masuk...'
        errorMessage.classList.add('hidden')

        try {
          const response = await authAPI.login(email, password)
          localStorage.setItem('token', response.token)
          window.location.href = 'dashboard.html'
        } catch (error) {
          errorMessage.textContent = error.message || 'Login gagal'
          errorMessage.classList.remove('hidden')
        } finally {
          submitBtn.disabled = false
          submitBtn.textContent = 'Masuk'
        }
      })
    </script>
  </body>
</html>
