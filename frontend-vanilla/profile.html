<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil / AcaraKita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              xblack: '#000000',
              xdark: '#16181c',
              xgray: '#2F3336',
              xblue: '#1D9BF0',
              xtext: '#E7E9EA',
              xtextgray: '#71767B',
            },
            fontFamily: {
              sans: [
                'system-ui',
                '-apple-system',
                'BlinkMacSystemFont',
                'Segoe UI',
                'Roboto',
                'Ubuntu',
                'Helvetica Neue',
                'sans-serif',
              ],
            },
          },
        },
      }
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script>
      if (!localStorage.getItem('token')) {
        window.location.href = 'login.html'
      }
    </script>
    <style>
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #000;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
    </style>
  </head>
  <body class="bg-xblack text-xtext min-h-screen overflow-x-hidden mb-16 md:mb-0">
    <div class="container mx-auto max-w-[1300px] flex min-h-screen">
      <!-- LEFT SIDEBAR (Hidden on Mobile) -->
      <header
        class="hidden md:flex w-[80px] xl:w-[275px] h-screen sticky top-0 flex-col justify-between px-2 xl:px-4 py-4 border-r border-xgray z-50"
      >
        <div class="flex flex-col space-y-4">
          <div
            class="p-3 w-fit hover:bg-[#181818] rounded-full transition-colors cursor-pointer"
            onclick="window.location.href='dashboard.html'"
          >
            <span class="text-3xl font-bold text-xtext">A</span>
          </div>

          <nav class="space-y-2">
            <button
              onclick="window.location.href='dashboard.html'"
              class="w-full flex items-center gap-4 p-3 rounded-full hover:bg-[#181818] transition-colors group"
            >
              <i class="fa-solid fa-house text-2xl text-xtextgray group-hover:text-xtext"></i>
              <span class="hidden xl:inline text-xl text-xtextgray group-hover:text-xtext"
                >Beranda</span
              >
            </button>

            <!-- Calendar -->
            <button
              onclick="window.location.href='dashboard.html?view=calendar'"
              class="w-full flex items-center gap-4 p-3 rounded-full hover:bg-[#181818] transition-colors group"
            >
              <i class="fa-solid fa-calendar text-2xl text-xtextgray group-hover:text-xtext"></i>
              <span class="hidden xl:inline text-xl text-xtextgray group-hover:text-xtext"
                >Kalender</span
              >
            </button>

            <button
              onclick="window.location.href='graphql.html'"
              class="w-full flex items-center gap-4 p-3 rounded-full hover:bg-[#181818] transition-colors group"
            >
              <i
                class="fa-solid fa-magnifying-glass text-2xl text-xtextgray group-hover:text-xtext"
              ></i>
              <span class="hidden xl:inline text-xl text-xtextgray group-hover:text-xtext"
                >Cari Event</span
              >
            </button>

            <button
              onclick="window.location.href='profile.html'"
              class="w-full flex items-center gap-4 p-3 rounded-full hover:bg-[#181818] transition-colors group"
            >
              <i class="fa-solid fa-user text-2xl text-xtext font-bold"></i>
              <span class="hidden xl:inline text-xl text-xtext font-bold">Profil</span>
            </button>
          </nav>
        </div>

        <div
          onclick="logout()"
          class="p-3 hover:bg-[#181818] rounded-full cursor-pointer flex items-center gap-3 transition-colors mb-4"
        >
          <div class="w-10 h-10 bg-gray-500 rounded-full flex items-center justify-center">
            <i class="fa-solid fa-user text-white"></i>
          </div>
          <div class="hidden xl:block flex-1">
            <p class="font-bold text-sm">Akun Saya</p>
            <p class="text-xtextgray text-sm">@logout</p>
          </div>
        </div>
      </header>

      <!-- MIDDLE COLUMN (PROFILE CONTENT) -->
      <main class="flex-1 border-r border-xgray max-w-[600px] w-full relative">
        <!-- Sticky Header -->
        <div
          class="sticky top-0 bg-xblack/80 backdrop-blur-md border-b border-xgray z-40 px-4 py-2 flex items-center gap-6 cursor-pointer"
          onclick="window.scrollTo(0,0)"
        >
          <a href="dashboard.html" class="p-2 rounded-full hover:bg-gray-800 transition"
            ><i class="fa-solid fa-arrow-left text-xtext"></i
          ></a>
          <div>
            <h2 id="headerName" class="text-xl font-bold leading-tight">...</h2>
            <p class="text-xs text-xtextgray">35 Posts</p>
          </div>
        </div>

        <!-- Banner Image (Placeholder) -->
        <div class="h-48 bg-[#333639] relative"></div>

        <!-- Profile Info Section -->
        <div class="px-4 pb-4 relative">
          <!-- Avatar -->
          <div class="w-32 h-32 bg-xblack rounded-full absolute -top-16 p-1">
            <div class="w-full h-full bg-gray-500 rounded-full flex items-center justify-center">
              <span class="text-5xl font-bold text-white">A</span>
            </div>
          </div>

          <!-- Edit Profile Button -->
          <div class="flex justify-end py-3">
            <button
              onclick="toggleEditMode()"
              class="border border-xgray font-bold rounded-full px-4 py-2 hover:bg-[#181818] transition"
            >
              Edit profil
            </button>
          </div>

          <!-- Labels -->
          <div id="profileView" class="mt-4">
            <!-- Injected via JS -->
            <div class="animate-pulse space-y-2">
              <div class="h-6 w-32 bg-xgray rounded"></div>
              <div class="h-4 w-24 bg-xgray rounded"></div>
            </div>
          </div>

          <!-- Tabs -->
          <div class="flex mt-8 border-b border-xgray">
            <div class="flex-1 text-center p-4 hover:bg-[#181818] cursor-pointer relative">
              <span class="font-bold border-b-4 border-xblue pb-4">Posts</span>
            </div>
            <div class="flex-1 text-center p-4 hover:bg-[#181818] cursor-pointer text-xtextgray">
              <span>Replies</span>
            </div>
            <div class="flex-1 text-center p-4 hover:bg-[#181818] cursor-pointer text-xtextgray">
              <span>Media</span>
            </div>
            <div class="flex-1 text-center p-4 hover:bg-[#181818] cursor-pointer text-xtextgray">
              <span>Likes</span>
            </div>
          </div>

          <!-- Content Area (Empty for now) -->
          <div class="text-center py-10 text-xtextgray">
            <p>Belum ada postingan.</p>
          </div>
        </div>
      </main>

      <!-- RIGHT SIDEBAR -->
      <aside class="hidden lg:block w-[350px] pl-8 py-4 sticky top-0 h-screen">
        <div class="bg-xdark rounded-xl border border-xgray overflow-hidden p-4">
          <h2 class="font-bold text-xl mb-3">You might like</h2>
          <div class="space-y-4">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 bg-gray-500 rounded-full"></div>
              <div class="flex-1">
                <p class="font-bold text-sm">Komunitas Code</p>
                <p class="text-xtextgray text-xs">@code_id</p>
              </div>
              <button class="bg-xtext text-black px-4 py-1.5 rounded-full font-bold text-sm">
                Follow
              </button>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <!-- MOBILE BOTTOM NAV -->
    <!-- MOBILE BOTTOM NAV -->
    <nav
      class="fixed bottom-0 w-full bg-black/90 backdrop-blur-md border-t border-xgray flex justify-around items-center py-3 z-50 md:hidden px-2"
    >
      <a href="dashboard.html" class="text-xtextgray flex flex-col items-center"
        ><i class="fa-solid fa-house text-xl"></i
      ></a>
      <a href="dashboard.html?view=calendar" class="text-xtextgray flex flex-col items-center"
        ><i class="fa-solid fa-calendar text-xl"></i
      ></a>

      <button
        onclick="window.location.href='dashboard.html'"
        class="text-white bg-xblue rounded-full w-12 h-12 flex items-center justify-center -mt-4 shadow-lg shadow-blue-500/30"
      >
        <i class="fa-solid fa-plus text-xl"></i>
      </button>

      <a href="graphql.html" class="text-xtextgray flex flex-col items-center"
        ><i class="fa-solid fa-magnifying-glass text-xl"></i
      ></a>
      <a href="profile.html" class="text-xtext flex flex-col items-center"
        ><i class="fa-solid fa-user text-xl"></i
      ></a>
    </nav>

    <!-- Edit Profile Modal -->
    <div
      id="editModal"
      class="hidden fixed inset-0 bg-[#5b7083]/40 z-50 flex items-center justify-center p-4"
    >
      <div
        class="bg-black w-full max-w-[600px] h-[650px] rounded-2xl shadow-xl overflow-y-auto relative border border-xgray"
      >
        <div
          class="sticky top-0 bg-black/80 backdrop-blur z-10 flex justify-between items-center p-4"
        >
          <div class="flex items-center gap-4">
            <button
              onclick="toggleEditMode()"
              class="text-xtext hover:bg-white/10 p-2 rounded-full"
            >
              <i class="fa-solid fa-xmark"></i>
            </button>
            <h2 class="font-bold text-xl">Edit Profil</h2>
          </div>
          <button
            form="editMode"
            type="submit"
            class="bg-xtext text-black font-bold px-5 py-1.5 rounded-full hover:bg-gray-200"
          >
            Simpan
          </button>
        </div>

        <!-- Cover Image Edit Placeholder -->
        <div
          class="h-32 bg-[#333639] w-full relative group cursor-pointer flex items-center justify-center"
        >
          <i class="fa-solid fa-camera text-white/50 text-2xl group-hover:text-white"></i>
        </div>

        <div class="px-4 pb-4">
          <!-- Avatar Edit Placeholder -->
          <div class="w-24 h-24 bg-xblack rounded-full -mt-12 mb-4 p-1 relative">
            <div
              class="w-full h-full bg-gray-500 rounded-full flex items-center justify-center cursor-pointer group hover:opacity-80"
            >
              <i class="fa-solid fa-camera text-white/50 group-hover:text-white"></i>
            </div>
          </div>

          <form id="editMode" class="space-y-6">
            <div
              class="relative group border border-gray-600 rounded p-2 focus-within:border-xblue focus-within:ring-1 focus-within:ring-xblue pt-6"
            >
              <label class="absolute top-1 left-2 text-xs text-xtextgray">Nama</label>
              <input
                type="text"
                id="editName"
                class="w-full bg-transparent outline-none text-xtext"
                required
              />
            </div>

            <div
              class="relative group border border-gray-600 rounded p-2 bg-xgray/10 cursor-not-allowed pt-6"
            >
              <label class="absolute top-1 left-2 text-xs text-xtextgray"
                >Email (Tidak dapat diubah)</label
              >
              <input
                type="email"
                id="editEmail"
                class="w-full bg-transparent outline-none text-xtextgray"
                disabled
              />
            </div>

            <div
              class="relative group border border-gray-600 rounded p-2 focus-within:border-xblue focus-within:ring-1 focus-within:ring-xblue pt-6"
            >
              <label class="absolute top-1 left-2 text-xs text-xtextgray">Bio / Alamat</label>
              <textarea
                id="editAddress"
                class="w-full bg-transparent outline-none text-xtext resize-none h-20"
              ></textarea>
            </div>

            <div
              class="relative group border border-gray-600 rounded p-2 focus-within:border-xblue focus-within:ring-1 focus-within:ring-xblue pt-6"
            >
              <label class="absolute top-1 left-2 text-xs text-xtextgray">Lokasi / Telepon</label>
              <input
                type="text"
                id="editPhone"
                class="w-full bg-transparent outline-none text-xtext"
              />
            </div>

            <div
              class="relative group border border-gray-600 rounded p-2 focus-within:border-xblue focus-within:ring-1 focus-within:ring-xblue pt-6"
            >
              <label class="absolute top-1 left-2 text-xs text-xtextgray">Tanggal Lahir</label>
              <input
                type="date"
                id="editBirthday"
                class="w-full bg-transparent outline-none text-xtext"
              />
            </div>
          </form>

          <!-- Additional Actions -->
          <div class="mt-8 pt-4 border-t border-xgray space-y-4">
            <button
              onclick="showPasswordModal()"
              class="w-full border border-gray-600 py-3 rounded-full hover:bg-[#181818] transition text-xtext font-bold"
            >
              Ubah Password
            </button>
            <button
              onclick="document.getElementById('deleteAccountModal').classList.remove('hidden')"
              class="w-full border border-red-900 text-red-500 py-3 rounded-full hover:bg-red-900/10 transition font-bold"
            >
              Hapus Akun
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Password Modal -->
    <div
      id="passwordModal"
      class="hidden fixed inset-0 bg-[#5b7083]/40 z-50 flex items-center justify-center p-4"
    >
      <div class="bg-black border border-xgray rounded-xl p-6 w-full max-w-md">
        <h3 class="text-xl font-bold mb-6 text-xtext">Ubah Password</h3>

        <form id="passwordForm" class="space-y-4">
          <input
            type="password"
            id="currentPassword"
            placeholder="Password Saat Ini"
            class="w-full bg-black border border-gray-600 rounded p-3 text-xtext focus:border-xblue outline-none"
            required
          />
          <input
            type="password"
            id="newPassword"
            placeholder="Password Baru"
            class="w-full bg-black border border-gray-600 rounded p-3 text-xtext focus:border-xblue outline-none"
            required
          />
          <input
            type="password"
            id="newPasswordConfirmation"
            placeholder="Konfirmasi Password Baru"
            class="w-full bg-black border border-gray-600 rounded p-3 text-xtext focus:border-xblue outline-none"
            required
          />

          <div class="flex gap-3 pt-4">
            <button
              type="button"
              onclick="closePasswordModal()"
              class="flex-1 py-2 bg-gray-600 rounded hover:bg-gray-500 text-white font-bold"
            >
              Batal
            </button>
            <button
              type="submit"
              class="flex-1 py-2 bg-xtext text-black rounded hover:bg-gray-200 font-bold"
            >
              Simpan
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Delete Modal -->
    <div
      id="deleteAccountModal"
      class="hidden fixed inset-0 bg-[#5b7083]/40 z-50 flex items-center justify-center p-4"
    >
      <div class="bg-black border border-xgray rounded-xl p-6 w-full max-w-md">
        <h3 class="text-xl font-bold mb-4 text-xtext">Hapus Akun?</h3>
        <p class="text-xtextgray mb-6">
          Tindakan ini tidak dapat dibatalkan. Semua data Anda akan hilang selamanya.
        </p>

        <div class="flex gap-3">
          <button
            type="button"
            onclick="closeDeleteAccountModal()"
            class="flex-1 py-2 bg-gray-600 rounded hover:bg-gray-500 text-white font-bold"
          >
            Batal
          </button>
          <button
            type="button"
            onclick="deleteAccount()"
            class="flex-1 py-2 bg-red-600 text-white rounded hover:bg-red-700 font-bold"
          >
            Hapus
          </button>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script>
      let profile = null

      // TOAST NOTIFICATION SYSTEM
      function showToast(message, type = 'success') {
        const toast = document.createElement('div')
        toast.className = `fixed bottom-20 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-white text-sm font-bold shadow-lg transition-all duration-300 opacity-0 translate-y-4 z-[70] ${type === 'error' ? 'bg-red-500 shadow-red-500/20' : 'bg-xblue shadow-blue-500/20'}`
        toast.textContent = message
        document.body.appendChild(toast)

        requestAnimationFrame(() => {
          toast.className = toast.className.replace(
            'opacity-0 translate-y-4',
            'opacity-100 translate-y-0'
          )
        })

        setTimeout(() => {
          toast.className += ' opacity-0 translate-y-4'
          setTimeout(() => toast.remove(), 300)
        }, 3000)
      }

      async function loadProfile() {
        try {
          const response = await profileAPI.getProfile()
          profile = response.data
          renderProfile()
        } catch (error) {
          console.error('Gagal memuat profil:', error)
          showToast('Gagal memuat profil', 'error')
        }
      }

      function renderProfile() {
        // Update Sticky Header
        if (profile) document.getElementById('headerName').textContent = profile.name

        const profileView = document.getElementById('profileView')
        profileView.innerHTML = `
          <div>
              <h1 class="text-xl font-bold text-xtext leading-tight">${profile.name}</h1>
              <p class="text-xtextgray text-sm">@${profile.email.split('@')[0]}</p>
          </div>
          
          <div class="mt-3 text-xtext space-y-1">
               ${profile.address ? `<p>${profile.address}</p>` : ''}
          </div>

          <div class="mt-3 flex flex-wrap gap-x-4 gap-y-1 text-xtextgray text-sm">
               ${profile.phone ? `<span><i class="fa-solid fa-phone text-xs"></i> ${profile.phone}</span>` : ''}
               ${profile.birthday ? `<span><i class="fa-solid fa-cake-candles text-xs"></i> Lahir ${new Date(profile.birthday).toLocaleDateString('id-ID')}</span>` : ''}
               <span><i class="fa-regular fa-calendar text-xs"></i> Bergabung Desember 2025</span>
          </div>
          
          <div class="mt-3 flex gap-4 text-sm">
               <span class="text-xtext font-bold">143 <span class="text-xtextgray font-normal">Mengikuti</span></span>
               <span class="text-xtext font-bold">89 <span class="text-xtextgray font-normal">Pengikut</span></span>
          </div>
      `
      }

      function toggleEditMode() {
        const modal = document.getElementById('editModal')
        if (modal.classList.contains('hidden')) {
          // OPEN
          document.getElementById('editName').value = profile.name || ''
          document.getElementById('editEmail').value = profile.email
          document.getElementById('editBirthday').value = profile.birthday
            ? new Date(profile.birthday).toISOString().slice(0, 10)
            : ''
          document.getElementById('editPhone').value = profile.phone || ''
          document.getElementById('editAddress').value = profile.address || ''
          modal.classList.remove('hidden')
        } else {
          // CLOSE
          modal.classList.add('hidden')
        }
      }

      document.getElementById('editMode').addEventListener('submit', async (e) => {
        e.preventDefault()

        const profileData = {
          name: document.getElementById('editName').value,
          birthday: document.getElementById('editBirthday').value || undefined,
          phone: document.getElementById('editPhone').value || undefined,
          address: document.getElementById('editAddress').value || undefined,
        }

        try {
          await profileAPI.updateProfile(profileData)
          showToast('Profil berhasil diperbarui!')
          toggleEditMode()
          await loadProfile()
        } catch (error) {
          showToast('Gagal memperbarui profil', 'error')
        }
      })

      function showPasswordModal() {
        document.getElementById('passwordModal').classList.remove('hidden')
      }

      function closePasswordModal() {
        document.getElementById('passwordModal').classList.add('hidden')
        document.getElementById('passwordForm').reset()
      }

      document.getElementById('passwordForm').addEventListener('submit', async (e) => {
        e.preventDefault()

        const currentPassword = document.getElementById('currentPassword').value
        const newPassword = document.getElementById('newPassword').value
        const newPasswordConfirmation = document.getElementById('newPasswordConfirmation').value

        if (newPassword !== newPasswordConfirmation) {
          showToast('Password baru tidak cocok!', 'error')
          return
        }

        try {
          await profileAPI.resetPassword(currentPassword, newPassword, newPasswordConfirmation)
          showToast('Password berhasil diubah!')
          closePasswordModal()
        } catch (error) {
          showToast('Gagal mengubah password', 'error')
        }
      })

      function closeDeleteAccountModal() {
        document.getElementById('deleteAccountModal').classList.add('hidden')
      }

      async function deleteAccount() {
        if (!confirm('Apakah Anda yakin ingin menghapus akun Anda?')) return

        try {
          await profileAPI.deleteAccount()
          showToast('Akun berhasil dihapus.')
          logout()
        } catch (error) {
          showToast('Gagal menghapus akun.', 'error')
        }
      }

      function logout() {
        localStorage.removeItem('token')
        window.location.href = 'login.html'
      }

      loadProfile()
    </script>
  </body>
</html>
